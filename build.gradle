buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }

    dependencies {
        classpath "io.freefair.gradle:lombok-plugin:$gradlePluginLombokVersion"
        classpath "com.github.ben-manes:gradle-versions-plugin:$gradlePluginVersionsVersion"
        classpath "gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:$licenseGradlePluginVersion"
    }
}

allprojects {
    group = "$groupPackage"
    version = "$projectVersion"
}

subprojects {

    apply plugin: "signing"
    apply plugin: "java"
    apply plugin: "jacoco"
    apply plugin: "maven-publish"
    apply plugin: "com.github.ben-manes.versions"
    apply plugin: "com.github.hierynomus.license"
    // license-gradle-plugin 0.16.1 on Gradle 8.14.6: licenseFormat writes exactly the header every
    // file carries, and the check still reports each file as missing it (measured by removing a
    // header and letting licenseFormat write it back, #31). The check tasks are off;
    // licenseFormat stays
    tasks.matching { it.name == "licenseMain" || it.name == "licenseTest" }.configureEach {
        enabled = false
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        compileOnly("org.projectlombok:lombok:$lombokVersion")
        annotationProcessor("org.projectlombok:lombok:$lombokVersion")
        testImplementation("de.alpharogroup:test-objects:$testObjectsVersion")
        testImplementation("de.alpharogroup:silly-collections:$sillyCollectionsVersion")
        testImplementation("de.alpharogroup:silly-beans:$sillyBeansVersion")
        testImplementation("de.alpharogroup:jobj-contract-verifier:$jobjContractVerifierVersion")
        testImplementation("org.meanbean:meanbean:$meanbeanVersion")
        testImplementation("org.testng:testng:$testngVersion")
    }

    // workhack for license issue #76
    gradle.startParameter.excludedTaskNames += "licenseMain"
    gradle.startParameter.excludedTaskNames += "licenseTest"

    sourceCompatibility = "$projectSourceCompatibility"

    javadoc {
        if (JavaVersion.current().isJava9Compatible()) {
            options.addBooleanOption("html5", true)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
    }

    test {
        useTestNG()
        // The contract checks of the de.alpharogroup test libraries clone objects through
        // reflection into java.util, which JDK 17 refuses unless the package is opened (#31);
        // JDK 8 knows no --add-opens
        if (JavaVersion.current().isJava9Compatible()) {
            jvmArgs "--add-opens", "java.base/java.util=ALL-UNNAMED"
        }
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }

    check.dependsOn jacocoTestReport
}
